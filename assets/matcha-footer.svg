<svg xmlns="http://www.w3.org/2000/svg" width="960" height="108" viewBox="0 0 960 108" role="img" aria-labelledby="title desc">
<title id="title">Small commits. Big trajectories.</title><desc id="desc">A pixel matcha cup with gently rising steam. Built with matcha and the occasional jet fuel.</desc>
<style>
  .float { animation: float 5s steps(5, end) infinite; }
  .spark { animation: sparkle 4s steps(2, end) infinite; }
  .steam { animation: float 3s steps(4, end) infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes sparkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .float,.spark,.steam { animation: none; } }
</style>
<rect x="0" y="0" width="960" height="108" fill="#141d18" />
<rect x="1" y="1" width="958" height="106" fill="none" stroke="#3a5140"/>
<g shape-rendering="crispEdges"><rect x="40" y="43" width="48" height="28" fill="#aac986" /><rect x="46" y="71" width="36" height="6" fill="#aac986" /><rect x="88" y="47" width="12" height="18" fill="#aac986" /><rect x="88" y="51" width="8" height="10" fill="#141d18" /><rect x="36" y="81" width="64" height="4" fill="#3a5140" /><g class="steam"><rect x="50" y="24" width="4" height="12" fill="#8fa58c" /><rect x="66" y="20" width="4" height="12" fill="#8fa58c" /></g></g><text x="126" y="48" fill="#e0e8ce" font-family="monospace" font-size="20">SMALL COMMITS. BIG TRAJECTORIES.</text><text x="126" y="77" fill="#8fa58c" font-family="monospace" font-size="14">Built with matcha and the occasional jet fuel.</text><rect x="842" y="47" width="12" height="12" fill="#3a5140" /><rect x="862" y="47" width="12" height="12" fill="#8fa58c" /><rect x="882" y="47" width="12" height="12" fill="#aac986" /><rect x="902" y="47" width="12" height="12" fill="#e0e8ce" />
</svg>
